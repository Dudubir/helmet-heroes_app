name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files into Android folders
        run: |
          mkdir -p app/src/main/java/com/gamewrap/app app/src/main/assets
          cp app.build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/gamewrap/app/MainActivity.kt
          cp controller.js app/src/main/assets/controller.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/build/outputs/apk/debug/app-debug.apk
